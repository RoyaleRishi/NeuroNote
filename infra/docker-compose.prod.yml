services:
  db:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always

  api:
    image: ghcr.io/royalerishi/neuronote-api:latest
    volumes: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://neuronote:${DB_PASSWORD}@db:5432/neuronote
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.anthropic.com/v1/}
      ANTHROPIC_API_KEY: ${LLM_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      PREF_ENCRYPTION_KEY: ${PREF_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}/workspace
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    restart: always

  web:
    image: ghcr.io/royalerishi/neuronote-web:latest
    command: ["sh", "-c", "node_modules/.bin/next start --hostname 0.0.0.0 --port ${PORT:-3000}"]
    volumes: !reset []
    environment:
      PORT: "3000"
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - web
      - api
    restart: always

volumes:
  caddy-data:
  caddy-config:
