name: ci

on:
  push:
  pull_request:

jobs:
  api-fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
          cache-dependency-glob: "api/uv.lock"
      - name: Sync API dependencies
        run: uv sync --project api --group dev
      - name: Lint
        run: uv run --project api --group dev ruff check api/src shared tests
      - name: Type check
        run: uv run --project api --group dev mypy api/src shared
      - name: Tests
        run: uv run --project api --group dev pytest tests/integration tests/unit -q

  web-fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Type check
        run: cd web && npm run typecheck
      - name: Tests
        run: cd web && npm run test

  deploy:
    needs: [api-fast-checks, web-fast-checks]
    if: github.ref == 'refs/heads/rework' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret shape
        run: |
          echo "length: $(echo -n "${{ secrets.GCP_SSH_KEY }}" | wc -c)"
          echo "first line:"
          echo "${{ secrets.GCP_SSH_KEY }}" | head -1

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/neuronote
            git pull origin rework
            make deploy-prod