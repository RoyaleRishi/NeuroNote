[project]
name = "neuronote-api"
version = "0.1.0"
description = "NeuroNote API service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "authlib>=1.3.0,<2.0.0",
  "cryptography>=41.0.0,<45.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "openai>=1.0.0,<2.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "sentence-transformers>=3.0.0,<4.0.0",
  "torch>=2.0.0,<3.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "slowapi>=0.1.9,<1.0.0",
  "itsdangerous>=2.1.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "yake>=0.4.8,<1.0",
  # spaCy drives noun-chunk candidate generation + Hearst pattern matching in
  # the deterministic concept pipeline — a runtime requirement, not a dev tool.
  "spacy>=3.8,<4.0",
  "en-core-web-sm",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["api/src", "."]
testpaths = ["tests"]
markers = [
  "integration: integration-level tests",
  "postgres: tests that require PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
